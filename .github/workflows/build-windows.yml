name: Build Windows

on:
  workflow_dispatch:
  push:
    branches: [main, master]
  release:
    types: [created]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: Shade-AI-Windows
          path: dist/*.exe
          if-no-files-found: error
      # Attach the installer to a GitHub Release for a direct download link
      - name: Upload to Release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.exe
